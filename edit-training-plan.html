<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Edit Training Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/create-training-plan.css">
</head>

<body>
    <div class="canvas">
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <div class="cp-page">
            <div class="cp-main">

                <!-- Plan Settings (goal + days — no generation) -->
                <div class="cp-settings-card">
                    <h2 class="cp-card-title">Plan Settings</h2>
                    <div class="cp-settings-row">
                        <div class="cp-field-group cp-field-group--grow">
                            <label class="cp-field-label">Plan Name</label>
                            <input type="text" id="cpPlanName" class="cp-text-input" placeholder="e.g. Push / Pull / Legs">
                        </div>
                        <div class="cp-field-group">
                            <label class="cp-field-label">Goal</label>
                            <div class="cp-select-wrap">
                                <select id="cpGoal">
                                    <option>Hypertrophy</option>
                                    <option>Strength</option>
                                    <option>Fat Loss</option>
                                    <option>Endurance</option>
                                </select>
                            </div>
                        </div>
                        <div class="cp-field-group">
                            <label class="cp-field-label">Days per Week</label>
                            <div class="cp-select-wrap">
                                <select id="cpDays">
                                    <option>3</option>
                                    <option selected>4</option>
                                    <option>5</option>
                                    <option>6</option>
                                    <option>7</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Weekly Workout Editor -->
                <div class="cp-editor-card">
                    <h2 class="cp-card-title">Weekly Workout Editor</h2>
                    <div class="cp-week-grid" id="cpWeekGrid"></div>
                    <div class="cp-editor-footer">
                        <button class="cp-back-btn" type="button" id="cpBackBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Back
                        </button>
                        <button class="cp-save-btn" type="button" id="cpSaveBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17 21v-8H7v8M7 3v5h8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Save Plan
                        </button>
                    </div>
                </div>

            </div><!-- /.cp-main -->

            <!-- Exercise Library -->
            <div class="cp-library">
                <h2 class="cp-lib-title">Exercise Library</h2>
                <div class="cp-lib-search-wrap">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="no-shrink">
                        <circle cx="11" cy="11" r="8" stroke="#878787" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35" stroke="#878787" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" class="cp-lib-search" id="cpLibSearch" placeholder="Search">
                </div>
                <div class="cp-lib-list" id="cpLibList"></div>
            </div>

        </div><!-- /.cp-page -->
    </div><!-- /.canvas -->

    <script type="module" src="js/services/dataService.js"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/shared/base.js"></script>
    <script type="module" src="js/pages/editTrainingPlan.js"></script>
</body>

</html>
