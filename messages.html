<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body>
    <div class="canvas">

        <!-- ============== SIDEBAR ============== -->
        <aside class="sidebar">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="19" width="6" height="10" rx="1.5" fill="#00800F"/>
                    <rect x="39" y="19" width="6" height="10" rx="1.5" fill="#00800F"/>
                    <rect x="9" y="15" width="5" height="18" rx="1.5" fill="#00800F"/>
                    <rect x="34" y="15" width="5" height="18" rx="1.5" fill="#00800F"/>
                    <rect x="14" y="22" width="20" height="4" rx="1" fill="#00800F"/>
                </svg>
                <span class="logo-text">Sportie</span>
            </div>

            <nav class="nav">
                <a class="nav-item" href="dashboard.html" data-section="dashboard" style="top:207px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
                        <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a class="nav-item" href="trainees.html" data-section="trainees" style="top:274px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/>
                        <circle cx="17" cy="9" r="2.5" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M15 20c0-2.5 1.5-4.5 4-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>Trainees List</span>
                </a>

                <a class="nav-item active" href="messages.html" data-section="messages" style="top:318px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M4 5h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 3V6a1 1 0 011-1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    <span>Messages</span>
                </a>

                <a class="nav-item" href="templates.html" data-section="templates" style="top:369px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M3 9h18M9 9v12" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Templates</span>
                </a>

                <a class="nav-item" href="analytics.html" data-section="analytics" style="top:416px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M4 20V10M10 20V4M16 20v-8M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>Trainee analytics</span>
                </a>

                <a class="nav-item" href="settings.html" data-section="settings" style="top:464px;">
                    <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <button class="logout-btn" type="button">log out</button>
        </aside>

        <!-- ============== TOP BAR ============== -->
        <header class="topbar">
            <h1 class="topbar-title">Messages</h1>

            <button class="bell-btn" type="button" aria-label="Notifications">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M6 8a6 6 0 1112 0c0 4 1.5 5.5 2.5 6.5H3.5C4.5 13.5 6 12 6 8z" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M10 19a2 2 0 004 0" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="user-area">
                <div class="user-avatar">
                    <svg class="user-avatar-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <circle cx="7" cy="4.5" r="2.5" stroke="#C0C0C0" stroke-width="1.5"/>
                        <path d="M2 12.5c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="#C0C0C0" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="user-name">Trainer Name</span>
                <svg class="user-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M3 4.5l3 3 3-3" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </header>

        <!-- ============== CONTENT ============== -->
        <div class="page-content">Messages — coming soon</div>

    </div>

    <script src="js/dataService.js"></script>
    <script src="js/authService.js"></script>
    <script src="js/base.js"></script>
</body>
</html>
