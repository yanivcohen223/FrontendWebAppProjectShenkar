<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Trainees List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/loader.css">
    <!-- Reused for the list error-state text (.analytics-state-title / -text). -->
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/trainees.css">
</head>
<body>
    <div class="canvas">

        <!-- Populated by sidebar.js / base.js -->
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!--  CONTENT - TRAINEES LIST  -->
        <div class="trainees-content">

        <!-- Subtitle -->
        <div class="trainees-subtitle">Manage and monitor your trainees</div>

        <!-- Search bar -->
        <label class="trainees-search">
            <span class="trainees-search-icon">&#128269;</span>
            <input class="trainees-search-input" type="text" placeholder="search clients....." />
        </label>

        <!-- Filter button -->
        <div class="filter-wrapper">
            <button class="trainees-filter" type="button">
                <img class="trainees-filter-icon" src="images/filterIcon.svg" alt="" width="16" height="16">
                <span>Filter clients</span>
            </button>
            <div class="filter-dropdown" id="filterDropdown">
                <button class="filter-option active" data-status="all">All</button>
                <button class="filter-option" data-status="active">Active</button>
                <button class="filter-option" data-status="paused">Paused</button>
                <button class="filter-option" data-status="finished">Finished</button>
            </div>
        </div>

        <!-- Table outer card -->
        <div class="trainees-table-card"></div>

        <!-- Table header (column labels) -->
        <div class="trainees-header">
            <span class="th th-avatar">Avatar</span>
            <span class="th th-name">Name</span>
            <span class="th th-status">Status</span>
            <span class="th th-goal">Goal</span>
            <span class="th th-progress">Progress</span>
            <span class="th th-last-activity">Last Activity</span>
        </div>

        <!-- Inner white table area -->
        <div class="trainees-inner">
            <!-- Empty state - hidden until the fetch resolves; the loading spinner shows first. -->
            <div class="trainees-empty hidden" id="traineesEmpty">
                <img src="images/traineeIcon.svg" alt="" width="48" height="48">
                <p class="trainees-empty-title">No trainees yet</p>
                <p class="trainees-empty-subtitle">Connect your database to see your trainees</p>
            </div>

            <!-- Rows fetched here dynamically by renderTrainees(...) -->
            <div id="traineesList"></div>
        </div>

        </div><!-- /.trainees-content --> </div>

    <script type="module" src="js/services/dataService.js"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/shared/base.js"></script>
    <script type="module" src="js/pages/trainees.js"></script>
</body>
</html>
