<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Trainees List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/trainees.css">
</head>
<body>
    <div class="canvas">

        <!-- ============== SIDEBAR ============== -->
        <div class="sidebar">
            <div class="logo">
                <img class="logo-icon" src="images/projectIcon.svg" alt="Sportie logo" width="48" height="48">
                <span class="logo-text">Sportie</span>
            </div>

            <div class="nav">
                <a class="nav-item" href="dashboard.html" data-section="dashboard" style="top:207px;">
                    <img class="nav-icon" src="images/dashboardIcon.svg" alt="" width="24" height="24">
                    <span>Dashboard</span>
                </a>

                <a class="nav-item active" href="trainees.html" data-section="trainees" style="top:274px;">
                    <img class="nav-icon" src="images/traineeIcon.svg" alt="" width="24" height="24">
                    <span>Trainees List</span>
                </a>

                <a class="nav-item" href="messages.html" data-section="messages" style="top:318px;">
                    <img class="nav-icon" src="images/messagesIcon.svg" alt="" width="24" height="24">
                    <span>Messages</span>
                </a>

                <a class="nav-item" href="templates.html" data-section="templates" style="top:369px;">
                    <img class="nav-icon" src="images/templatesIcon.svg" alt="" width="24" height="24">
                    <span>Templates</span>
                </a>

                <a class="nav-item" href="analytics.html" data-section="analytics" style="top:416px;">
                    <img class="nav-icon" src="images/analyticsIcon.svg" alt="" width="24" height="24">
                    <span>Trainee analytics</span>
                </a>

                <a class="nav-item" href="settings.html" data-section="settings" style="top:464px;">
                    <img class="nav-icon" src="images/settingsIcon.svg" alt="" width="24" height="24">
                    <span>Settings</span>
                </a>
            </div>

            <button class="logout-btn" type="button">log out</button>
        </div>

        <!-- ============== TOP BAR ============== -->
        <div class="topbar">
            <h1 class="topbar-title">Trainees List</h1>

            <button class="bell-btn" type="button" aria-label="Notifications">
                <img src="images/notificationIcon.svg" alt="Notifications" width="24" height="24">
            </button>

            <div class="user-area">
                <div class="user-avatar">
                    <img class="user-avatar-icon" src="images/profileIcon.png" alt="" width="14" height="14">
                </div>
                <span class="user-name">Trainer Name</span>
                <span class="user-chevron">&#9660;</span>
            </div>
        </div>

        <!-- ============== CONTENT - TRAINEES LIST ============== -->
        <div class="trainees-content">

        <!-- Subtitle -->
        <div class="trainees-subtitle">Manage and monitor your trainees</div>

        <!-- Search bar -->
        <label class="trainees-search">
            <span class="trainees-search-icon">&#128269;</span>
            <input class="trainees-search-input" type="text" placeholder="search clients....." />
        </label>

        <!-- Filter button -->
        <div class="filter-wrapper">
            <button class="trainees-filter" type="button">
                <img class="trainees-filter-icon" src="images/filterIcon.svg" alt="" width="16" height="16">
                <span>Filter clients</span>
            </button>
            <div class="filter-dropdown" id="filterDropdown">
                <button class="filter-option active" data-status="all">All</button>
                <button class="filter-option" data-status="active">Active</button>
                <button class="filter-option" data-status="paused">Paused</button>
                <button class="filter-option" data-status="finished">Finished</button>
            </div>
        </div>

        <!-- Table outer card -->
        <div class="trainees-table-card"></div>

        <!-- Table header (column labels) -->
        <div class="trainees-header">
            <span class="th th-avatar">Avatar</span>
            <span class="th th-name">Name</span>
            <span class="th th-status">Status</span>
            <span class="th th-goal">Goal</span>
            <span class="th th-progress">Progress</span>
            <span class="th th-last-activity">Last Activity</span>
        </div>

        <!-- Inner white table area -->
        <div class="trainees-inner">
            <!-- Empty state - replaced dynamically by renderTrainees(...) -->
            <div class="trainees-empty" id="traineesEmpty">
                <img src="images/traineeIcon.svg" alt="" width="48" height="48">
                <p class="trainees-empty-title">No trainees yet</p>
                <p class="trainees-empty-subtitle">Connect your database to see your trainees</p>
            </div>

            <!-- Rows fetched here dynamically by renderTrainees(...) -->
            <div id="traineesList"></div>
        </div>

        </div><!-- /.trainees-content --> </div>

    <script src="js/dataService.js"></script>
    <script src="js/authService.js"></script>
    <script src="js/base.js"></script>
    <script src="js/trainees.js"></script>
</body>
</html>
