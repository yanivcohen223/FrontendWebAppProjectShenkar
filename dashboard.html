<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="canvas">

        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!--  STAT CARDS  -->
        <div class="dashboard-stats">
            <div class="stat-card stat-card--1">
                <div class="stat-icon-circle">
                    <img src="images/traineeIcon.svg" alt="" width="35" height="35">
                </div>
                <div class="stat-value" data-stat="totalClients">&mdash;</div>
                <div class="stat-subtitle">No data yet</div>
                <a class="stat-label link" data-action="total-clients">Total clients</a>
            </div>

            <div class="stat-card stat-card--2">
                <div class="stat-icon-circle">
                    <img src="images/analyticsIcon.svg" alt="" width="35" height="35">
                </div>
                <div class="stat-value" data-stat="activeClients">&mdash;</div>
                <div class="stat-subtitle">No data yet</div>
                <div class="stat-label">Active Clients</div>
            </div>

<div class="stat-card stat-card--4">
                <div class="stat-icon-circle">
                    <img src="images/targetIcon.svg" alt="" width="35" height="35">
                </div>
                <div class="stat-value stat-value-sm" data-stat="avgProgress">&mdash;</div>
                <div class="stat-subtitle">No data yet</div>
                <div class="stat-label">Avg Progress</div>
            </div>
        </div>

        <!--  CHART CARD  -->
        <div class="chart-card">
            <h2 class="chart-title">Active Trainees per Month</h2>
            <div class="chart-canvas-wrap">
                <canvas id="overviewChart"></canvas>
            </div>
        </div>

        <div class="clients-panel">
            <a class="clients-view-all" data-action="view-all-clients">View All</a>
            <h2 class="clients-title">Most Active Clients</h2>
            <div class="clients-list-bg"></div>

            <div class="clients-empty" id="clientsEmpty">
                <img src="images/traineeIcon.svg" alt="" width="40" height="40">
                <p class="clients-empty-title">No clients yet</p>
            </div>

            <div id="clientsList"></div>
        </div>

    </div>

    <script type="module" src="js/services/dataService.js"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/shared/base.js"></script>
    <script type="module" src="js/pages/dashboard.js"></script>
</body>

</html>
