<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="canvas">

        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!-- ============== STAT CARDS ============== -->
        <div class="stat-card" style="left:295px; top:99px;">
            <div class="stat-icon-circle">
                <img src="images/traineeIcon.svg" alt="" width="35" height="35">
            </div>
            <div class="stat-value" data-stat="totalClients">&mdash;</div>
            <div class="stat-subtitle">No data yet</div>
            <a class="stat-label link" data-action="total-clients">Total clients</a>
        </div>

        <div class="stat-card" style="left:500px; top:99px;">
            <div class="stat-icon-circle">
                <img src="images/analyticsIcon.svg" alt="" width="35" height="35">
            </div>
            <div class="stat-value" data-stat="activeClients">&mdash;</div>
            <div class="stat-subtitle">No data yet</div>
            <div class="stat-label">Active Clients</div>
        </div>

        <div class="stat-card" style="left:705px; top:97px;">
            <div class="stat-icon-circle">
                <img src="images/workoutIcon.svg" alt="" width="35" height="35">
            </div>
            <div class="stat-value" data-stat="workouts">&mdash;</div>
            <div class="stat-subtitle">No data yet</div>
            <div class="stat-label">Workouts this week</div>
        </div>

        <div class="stat-card" style="left:910px; top:99px;">
            <div class="stat-icon-circle">
                <img src="images/targetIcon.svg" alt="" width="35" height="35">
            </div>
            <div class="stat-value stat-value-sm" data-stat="avgProgress">&mdash;</div>
            <div class="stat-subtitle">No data yet</div>
            <div class="stat-label">Avg Progress</div>
        </div>

        <!-- ============== CHART CARD ============== -->
        <div class="chart-card">
            <h2 class="chart-title">Active Trainees per Month</h2>
            <div class="chart-canvas-wrap">
                <canvas id="overviewChart"></canvas>
                <div class="chart-empty-overlay" id="chartEmptyOverlay">
                    No data yet &mdash; connect your database to see client progress
                </div>
            </div>
        </div>

        <!-- ============== RIGHT PANEL - MOST ACTIVE CLIENTS ============== -->
        <div class="clients-panel">
            <a class="clients-view-all" data-action="view-all-clients">View All</a>
            <h2 class="clients-title">Most Active Clients</h2>
            <div class="clients-list-bg"></div>

            <!-- Empty state - replaced dynamically by renderClients(...) -->
            <div class="clients-empty" id="clientsEmpty">
                <img src="images/traineeIcon.svg" alt="" width="40" height="40">
                <p class="clients-empty-title">No clients yet</p>
                <p class="clients-empty-subtitle">Connect your database to see active clients</p>
            </div>

            <!-- Client rows will be fetched to here dynamically by renderClients(...) -->
            <div id="clientsList"></div>
        </div>

    </div>

<script type="module" src="js/dataService.js"></script>
<script type="module" src="js/authService.js"></script>
<script type="module" src="js/base.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
