<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Trainee Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/analytics.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="canvas">

        <div class="sidebar">
            <div class="logo">
                <img class="logo-icon" src="images/projectIcon.svg" alt="Sportie logo" width="48" height="48">
                <span class="logo-text">Sportie</span>
            </div>

            <div class="nav">
                <a class="nav-item" href="dashboard.html" data-section="dashboard" style="top:207px;">
                    <img class="nav-icon" src="images/dashboardIcon.svg" alt="" width="24" height="24">
                    <span>Dashboard</span>
                </a>

                <a class="nav-item" href="trainees.html" data-section="trainees" style="top:274px;">
                    <img class="nav-icon" src="images/traineeIcon.svg" alt="" width="24" height="24">
                    <span>Trainees List</span>
                </a>

                <a class="nav-item" href="messages.html" data-section="messages" style="top:318px;">
                    <img class="nav-icon" src="images/messagesIcon.svg" alt="" width="24" height="24">
                    <span>Messages</span>
                </a>

                <a class="nav-item" href="templates.html" data-section="templates" style="top:369px;">
                    <img class="nav-icon" src="images/templatesIcon.svg" alt="" width="24" height="24">
                    <span>Templates</span>
                </a>

                <a class="nav-item active" href="analytics.html" data-section="analytics" style="top:416px;">
                    <img class="nav-icon" src="images/analyticsIcon.svg" alt="" width="24" height="24">
                    <span>Trainee analytics</span>
                </a>

                <a class="nav-item" href="settings.html" data-section="settings" style="top:464px;">
                    <img class="nav-icon" src="images/settingsIcon.svg" alt="" width="24" height="24">
                    <span>Settings</span>
                </a>
            </div>

            <button class="logout-btn" type="button">log out</button>
        </div>

        <div class="topbar">
            <h1 class="topbar-title">Trainee Analytics</h1>

            <button class="bell-btn" type="button" aria-label="Notifications">
                <img src="images/notificationIcon.svg" alt="Notifications" width="24" height="24">
            </button>

            <div class="user-area">
                <div class="user-avatar">
                    <img class="user-avatar-icon" src="images/profileIcon.png" alt="" width="14" height="14">
                </div>
                <span class="user-name">Trainer Name</span>
                <span class="user-chevron">&#9660;</span>
            </div>
        </div>

        <div class="page-content">

            <div class="analytics-toolbar">
                <span class="analytics-subtitle">Insights across your trainees</span>
                <div class="analytics-seg" id="viewToggle" role="group" aria-label="View mode">
                    <button type="button" class="analytics-seg-btn active" data-view="graph">Graph</button>
                    <button type="button" class="analytics-seg-btn" data-view="list">List</button>
                </div>
            </div>

            <div class="analytics-grid">

                <!-- 1. At-risk trainees -->
                <section class="analytics-card">
                    <div class="analytics-card-head">
                        <h2 class="analytics-card-title">At-risk trainees</h2>
                    </div>
                    <div class="analytics-card-body" id="body_atRisk"></div>
                </section>

                <!-- 2. Attendance distribution -->
                <section class="analytics-card">
                    <div class="analytics-card-head">
                        <h2 class="analytics-card-title">Attendance distribution</h2>
                    </div>
                    <div class="analytics-card-body" id="body_attendance"></div>
                </section>

                <!-- 3. Improvement leaderboard (own metric toggle) -->
                <section class="analytics-card">
                    <div class="analytics-card-head">
                        <h2 class="analytics-card-title">Improvement leaderboard</h2>
                        <div class="analytics-seg" id="metricToggle" role="group" aria-label="Metric">
                            <button type="button" class="analytics-seg-btn active" data-metric="body_weight">Body weight</button>
                            <button type="button" class="analytics-seg-btn" data-metric="strength">Strength</button>
                        </div>
                    </div>
                    <div class="analytics-card-body" id="body_leaderboard"></div>
                </section>

                <!-- 4. Volume over time -->
                <section class="analytics-card">
                    <div class="analytics-card-head">
                        <h2 class="analytics-card-title">Volume over time</h2>
                        <div class="analytics-seg" id="volumeRangeToggle" role="group" aria-label="Range">
                            <button type="button" class="analytics-seg-btn" data-range="4">4w</button>
                            <button type="button" class="analytics-seg-btn active" data-range="8">8w</button>
                            <button type="button" class="analytics-seg-btn" data-range="12">12w</button>
                            <button type="button" class="analytics-seg-btn" data-range="all">All</button>
                        </div>
                    </div>
                    <div class="analytics-card-body" id="body_volume"></div>
                </section>

                <!-- 5. Engagement heatmap (spans both columns) -->
                <section class="analytics-card analytics-card-wide">
                    <div class="analytics-card-head">
                        <h2 class="analytics-card-title">Engagement heatmap</h2>
                        <div class="analytics-seg" id="heatmapRangeToggle" role="group" aria-label="Range">
                            <button type="button" class="analytics-seg-btn" data-range="4">4w</button>
                            <button type="button" class="analytics-seg-btn active" data-range="8">8w</button>
                            <button type="button" class="analytics-seg-btn" data-range="12">12w</button>
                            <button type="button" class="analytics-seg-btn" data-range="all">All</button>
                        </div>
                    </div>
                    <div class="analytics-card-body" id="body_heatmap"></div>
                </section>

            </div>
        </div>

    </div>

    <script type="module" src="js/dataService.js"></script>
    <script type="module" src="js/authService.js"></script>
    <script type="module" src="js/base.js"></script>
    <script type="module" src="js/analytics.js"></script>
</body>
</html>
