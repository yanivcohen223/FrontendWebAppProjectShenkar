<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="page-background">
        <main class="main-container">
            <header class="logo-header">
                <i class="fas fa-dumbbell logo-icon"></i> <span class="logo-text">Sportie</span>
            </header>

            <form id="authForm" class="auth-form" novalidate>
                <h1 class="form-title" id="formTitle">Login</h1>
                <div class="input-group">
                    <label for="email" class="input-label">Email:</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="username@email.co.il" required>
                        <i class="fas fa-at input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password" class="input-label">Password:</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="**********" required> <i
                            class="fas fa-eye-slash input-icon toggle-password"></i>
                    </div>
                </div>
                <div class="input-group" id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPassword" class="input-label">Confirm Password:</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="**********" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>
                <a href="#" class="forgot-password">Forgot your password/email?</a>
                <button type="submit" class="submit-button" id="submitBtn">Enter</button>
                <a href="#" id="toggleLink" class="signup-link">Sign up!</a>
            </form>
            <div id="toast"></div>
        </main>
    </div>
    <script type="module" src="js/dataService.js"></script>
<script type="module" src="js/authService.js"></script>
<script type="module" src="js/formValidation.js"></script>
    <script type="module" src="js/formValidation.js"></script>
</body>

</html>
