<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Trainee Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/edit-workout.css">
</head>

<body>
    <div class="canvas">
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!-- ============== PROFILE CARD ============== -->
        <div class="profile-card">
            <div class="profile-avatar-wrap">
                <img id="traineeAvatar" src="images/profileIcon.png" alt="Avatar" class="profile-avatar">
            </div>

            <div class="profile-info">
                <h1 class="profile-name" id="traineeName">Eliya Danon</h1>
                <p class="profile-meta" id="traineeAge">Age: 33</p>
                <p class="profile-meta" id="traineeGoal">Goal: Fat Loss</p>
                <span class="status-badge active" id="traineeStatus">Active</span>
            </div>

            <div class="profile-stats">
                <div class="stat-box">
                    <span class="stat-box-label">Weight:</span>
                    <span class="stat-box-value" id="traineeWeight">87 Kg</span>
                </div>
                <div class="stat-box wider">
                    <span class="stat-box-label">Program Duration:</span>
                    <span class="stat-box-value" id="traineeDuration">8 Weeks</span>
                </div>
                <div class="stat-box wider">
                    <span class="stat-box-label">Overall Progress:</span>
                    <span class="stat-box-value" id="traineeProgress">50%</span>
                </div>
            </div>
        </div>

        <!-- ============== ACTION BUTTONS ============== -->
        <div class="profile-actions">
            <button class="btn-action btn-msg" type="button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="#000"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Message Client
            </button>
            <button class="btn-action btn-nut" type="button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="#000"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="9" y="3" width="6" height="4" rx="1" stroke="#000" stroke-width="1.5" />
                    <path d="M12 12v4M10 14h4" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                Edit Nutrition Plan
            </button>
            <button class="btn-action btn-nut" id="btnEditTraining"  type="button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="#000"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="9" y="3" width="6" height="4" rx="1" stroke="#000" stroke-width="1.5" />
                    <path d="M12 12v4M10 14h4" stroke="#000" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                Edit Training Plan
            </button>
            <button class="btn-action btn-trn" id="btnCreateTraining" type="button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="#fff"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="#fff" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Create Training Plan
            </button>
        </div>

        <!-- ============== TAB NAV ============== -->
        <div class="profile-tabs-wrap">
            <nav class="profile-tabs">
                <a href="#overview" class="profile-tab active" data-tab="overview">Overview</a>
                <a href="#workouts" class="profile-tab" data-tab="workouts">Workouts</a>
                <a href="#nutrition" class="profile-tab" data-tab="nutrition">Nutrition</a>
                <a href="#progress" class="profile-tab" data-tab="progress">Progress</a>
            </nav>
        </div>

        <!-- ============== CONTENT PANELS ============== -->
        <div class="profile-panels">

            <!-- Left: Weekly Activity -->
            <div class="panel-activity">
                <h2 class="panel-activity-title">Weekly Activity,</h2>
                <div class="chart-area">
                    <canvas id="traineeActivityChart"></canvas>
                    <span class="chart-label">Activity Graph</span>
                </div>
            </div>

            <!-- Right: Recent Activity -->
            <div class="panel-recent">
                <h2 class="panel-recent-title">Recent Activity</h2>
                <div id="recentActivityList" class="recent-list">
                    <div class="activity-item">
                        <svg class="activity-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="#00800F" stroke-width="1.5" />
                            <path d="M8 12l3 3 5-5" stroke="#00800F" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <div class="activity-details">
                            <span class="activity-name">Chest Day</span>
                            <span class="activity-date">Month, Day Year</span>
                        </div>
                        <span class="activity-status completed">status</span>
                    </div>
                    <div class="activity-item">
                        <svg class="activity-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="#00800F" stroke-width="1.5" />
                            <path d="M8 12l3 3 5-5" stroke="#00800F" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <div class="activity-details">
                            <span class="activity-name">Leg Day</span>
                            <span class="activity-date">Month, Day Year</span>
                        </div>
                        <span class="activity-status completed">status</span>
                    </div>
                    <div class="activity-item">
                        <svg class="activity-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="#999" stroke-width="1.5" />
                            <path d="M15 9l-6 6M9 9l6 6" stroke="#999" stroke-width="1.5" stroke-linecap="round" />
                        </svg>
                        <div class="activity-details">
                            <span class="activity-name">Cardio</span>
                            <span class="activity-date">Month, Day Year</span>
                        </div>
                        <span class="activity-status missed">status</span>
                    </div>
                </div>
            </div>

        </div><!-- /.profile-panels -->

    </div><!-- /.canvas -->

    <script type="module" src="js/traineeProfile.js"></script>
    <script type="module" src="js/base.js"></script>
</body>

</html>
