<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Trainee Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/edit-workout.css">
</head>

<body>
    <div class="canvas">
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!--  PROFILE CARD  -->
        <div class="profile-card">
            <div class="profile-avatar-wrap">
                <img id="traineeAvatar" src="images/profileIcon.png" alt="Avatar" class="profile-avatar">
            </div>

            <div class="profile-info">
                <h1 class="profile-name skeleton-text" id="traineeName"></h1>
                <p class="profile-meta skeleton-text" id="traineeAge"></p>
                <p class="profile-meta skeleton-text" id="traineeGoal"></p>
                <span class="status-badge skeleton-text" id="traineeStatus"></span>
            </div>

            <div class="profile-stats">
                <div class="stat-box">
                    <span class="stat-box-label">Weight:</span>
                    <span class="stat-box-value skeleton-text" id="traineeWeight"></span>
                </div>
                <div class="stat-box wider">
                    <span class="stat-box-label">Sessions This Month:</span>
                    <span class="stat-box-value skeleton-text" id="traineeSessionsMonth"></span>
                </div>
                <div class="stat-box wider">
                    <span class="stat-box-label">Overall Progress:</span>
                    <span class="stat-box-value skeleton-text" id="traineeProgress"></span>
                </div>
            </div>
        </div>


        <!--  TAB NAV  -->
        <div class="profile-tabs-wrap">
            <nav class="profile-tabs">
                <button class="profile-tab active" data-tab="overview">Overview</button>
                <button class="profile-tab" data-tab="plans">Training Plan</button>
                <button class="profile-tab" data-tab="nutrition">Nutrition</button>
            </nav>
        </div>

        <!--  CONTENT PANELS  -->
        <div class="profile-panels-container">

            <div id="tab-overview" class="profile-tab-panel active">
                <div class="profile-panels">
                    <div class="panel-activity">
                        <h2 class="panel-activity-title">Weekly Activity,</h2>
                        <div class="chart-area">
                            <canvas id="traineeActivityChart"></canvas>
                            <span class="chart-label">Activity Graph</span>
                        </div>
                    </div>

                    <div class="panel-recent">
                        <h2 class="panel-recent-title">Recent Activity</h2>
                        <div id="recentActivityList" class="recent-list">
                            <div class="activity-item">
                                <span class="activity-icon skeleton-text" style="width:38px;height:38px;min-width:38px;border-radius:50%;"></span>
                                <div class="activity-details">
                                    <span class="activity-name skeleton-text"></span>
                                    <span class="activity-date skeleton-text"></span>
                                </div>
                                <span class="activity-status skeleton-text"></span>
                            </div>
                            <div class="activity-item">
                                <span class="activity-icon skeleton-text" style="width:38px;height:38px;min-width:38px;border-radius:50%;"></span>
                                <div class="activity-details">
                                    <span class="activity-name skeleton-text"></span>
                                    <span class="activity-date skeleton-text"></span>
                                </div>
                                <span class="activity-status skeleton-text"></span>
                            </div>
                            <div class="activity-item">
                                <span class="activity-icon skeleton-text" style="width:38px;height:38px;min-width:38px;border-radius:50%;"></span>
                                <div class="activity-details">
                                    <span class="activity-name skeleton-text"></span>
                                    <span class="activity-date skeleton-text"></span>
                                </div>
                                <span class="activity-status skeleton-text"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-plans" class="profile-tab-panel">
                <div class="profile-panels">

                    <div class="panel-activity panel-full">
                        <div class="section-header">
                            <h2 class="panel-activity-title">Active Training Plan</h2>
                            <div class="section-header-right">
                                <span class="status-badge active">Current</span>
                                <button class="btn-edit-plan" type="button" id="btnEditPlan">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    Edit Plan
                                </button>
                            </div>
                        </div>

                        <div class="plan-meta-summary">
                            <div><strong>Goal:</strong> <span id="activePlanGoal"></span></div>
                            <div><strong>Frequency:</strong> <span id="activePlanDays"></span></div>
                        </div>

                        <div class="plan-weeks-preview-grid" id="plan-weeks-preview-grid">
                        </div>
                    </div>

                </div>
            </div>

            <div id="tab-nutrition" class="profile-tab-panel">
                <div class="profile-panels">

                    <div class="panel-activity panel-full">
                        <div class="section-header">
                            <h2 class="panel-activity-title skeleton-text" id="nutritionPlanName"></h2>
                            <div class="section-header-right">
                                <span class="status-badge active">Current</span>
                                <button class="btn-edit-plan" type="button" id="btnEditNutrition">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    Edit Plan
                                </button>
                            </div>
                        </div>

                        <div class="macro-cards-row">
                            <div class="macro-card primary">
                                <div class="macro-label macro-label-upper" id="nutritionCaloriesLabel">Target Calories</div>
                                <div class="macro-value macro-value-primary skeleton-text" id="nutritionCalories"></div>
                            </div>
                            <div class="macro-card">
                                <div class="macro-label" id="nutritionProteinLabel">Protein</div>
                                <div class="macro-value skeleton-text" id="nutritionProtein"></div>
                            </div>
                            <div class="macro-card">
                                <div class="macro-label" id="nutritionCarbsLabel">Carbs</div>
                                <div class="macro-value skeleton-text" id="nutritionCarbs"></div>
                            </div>
                            <div class="macro-card">
                                <div class="macro-label" id="nutritionFatsLabel">Fats</div>
                                <div class="macro-value skeleton-text" id="nutritionFats"></div>
                            </div>
                        </div>

                        <div class="meals-list" id="nutritionMealList">
                            <div class="meal-row">
                                <strong class="skeleton-text"></strong>
                                <span class="meal-description skeleton-text"></span>
                            </div>
                            <div class="meal-row">
                                <strong class="skeleton-text"></strong>
                                <span class="meal-description skeleton-text"></span>
                            </div>
                            <div class="meal-row">
                                <strong class="skeleton-text"></strong>
                                <span class="meal-description skeleton-text"></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>


        </div><!-- /.profile-panels-container -->

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="js/pages/traineeProfile.js"></script>
        <script type="module" src="js/shared/base.js"></script>
</body>

</html>
