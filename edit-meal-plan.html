<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Edit Meal Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/components.css">
    <link rel="stylesheet" href="style/sidebar.css">
    <link rel="stylesheet" href="style/toast.css">
    <link rel="stylesheet" href="style/templates.css">
</head>

<body>
    <div class="canvas">
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <div class="tpl-page emp-page">

            <!-- Scrollable body -->
            <div class="emp-scroll">
                <div class="tpl-card emp-meal-card">

                    <div class="tpl-card-row">
                        <div class="tpl-field-group tpl-grow">
                            <label class="tpl-field-label">Plan Name</label>
                            <input type="text" class="tpl-input" id="mpName" placeholder="e.g. Cut Phase">
                        </div>
                        <div class="tpl-field-group tpl-field-end">
                            <button class="tpl-btn-ghost" type="button" id="mpAddSlotBtn">+ Add Meal Slot</button>
                        </div>
                    </div>

                    <div class="tpl-meal-hint">Each meal slot offers a variety of options — the trainee picks one per slot.</div>

                    <div class="tpl-meal-macrobar" id="mpMacroBar"></div>

                    <div class="tpl-slots" id="mpSlots"></div>

                </div>
            </div>

            <!-- Footer: cancel + save -->
            <div class="tpl-builder-foot">
                <button class="tpl-btn-ghost" type="button" id="mpCancelBtn">Cancel</button>
                <button class="tpl-btn-primary" type="button" id="mpSaveBtn">Save Plan</button>
            </div>

        </div><!-- /.tpl-page -->
    </div><!-- /.canvas -->

    <script type="module" src="js/services/dataService.js"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/shared/base.js"></script>
    <script type="module" src="js/pages/editMealPlan.js"></script>
</body>

</html>
