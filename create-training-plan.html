<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportie - Create Training Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/create-training-plan.css">
</head>

<body>
    <div class="canvas">
        <div class="sidebar"></div>
        <div class="topbar"></div>

        <!-- ============== MAIN PAGE LAYOUT ============== -->
        <div class="cp-page">

            <!-- LEFT / CENTRE: Plan Settings + Weekly Workout Editor -->
            <div class="cp-main">

                <!-- ── Plan Settings ── -->
                <div class="cp-settings-card">
                    <h2 class="cp-card-title">Plan Settings</h2>

                    <div class="cp-settings-row">
                        <!-- Goal -->
                        <div class="cp-field-group">
                            <label class="cp-field-label">Goal</label>
                            <div class="cp-select-wrap">
                                <select id="cpGoal">
                                    <option>Hypertrophy</option>
                                    <option>Strength</option>
                                    <option>Fat Loss</option>
                                    <option>Endurance</option>
                                </select>
                            </div>
                        </div>

                        <!-- Days per Week -->
                        <div class="cp-field-group">
                            <label class="cp-field-label">Days per Week</label>
                            <div class="cp-select-wrap">
                                <select id="cpDays">
                                    <option>3</option>
                                    <option selected>4</option>
                                    <option>5</option>
                                    <option>6</option>
                                    <option>7</option>
                                </select>
                            </div>
                        </div>

                        <!-- Target Muscle Groups -->
                        <div class="cp-field-group">
                            <label class="cp-field-label">Target Muscle Groups</label>
                            <div class="cp-muscle-group">
                                <label class="cp-check-label">
                                    <input type="checkbox" checked> Chest
                                </label>
                                <label class="cp-check-label">
                                    <input type="checkbox" checked> Back
                                </label>
                                <label class="cp-check-label">
                                    <input type="checkbox" checked> Upper Legs
                                </label>
                                <label class="cp-check-label">
                                    <input type="checkbox" checked> Shoulders
                                </label>
                            </div>
                        </div>
                    </div><!-- /.cp-settings-row -->

                    <!-- Footer: summary + Generate button -->
                    <div class="cp-settings-footer">
                        <div class="cp-summary-bar">
                            <span class="cp-summary-tag">Chest</span>
                            <span class="cp-summary-sep">|</span>
                            <span class="cp-summary-tag">Legs</span>
                            <span class="cp-summary-sep">|</span>
                            <span class="cp-summary-tag">Hypertrophy</span>
                            <span class="cp-summary-sep">|</span>
                            <span class="cp-summary-tag">4 - Reps</span>
                            <span class="cp-summary-sep">|</span>
                            <span class="cp-summary-tag">Rest</span>
                            <span class="cp-summary-sep">|</span>
                            <span class="cp-summary-tag">90 secs</span>
                        </div>
                        <button class="cp-generate-btn" type="button" id="cpGenerateBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
                            </svg>
                            Generate Plan
                        </button>
                    </div>
                </div><!-- /.cp-settings-card -->

                <!-- ── Weekly Workout Editor ── -->
                <div class="cp-editor-card">
                    <h2 class="cp-card-title">Weekly Workout Editor</h2>
                    <div class="cp-week-grid" id="cpWeekGrid">
                        <!-- Day cards rendered by createTrainingPlan.js -->
                    </div>
                    <div class="cp-editor-footer">
                        <button class="cp-back-btn" type="button" id="cpBackBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            Back
                        </button>
                        <button class="cp-save-btn" type="button" id="cpSaveBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17 21v-8H7v8M7 3v5h8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Save Plan
                        </button>
                    </div>
                </div>

            </div><!-- /.cp-main -->

            <!-- RIGHT: Exercise Library -->
            <div class="cp-library">
                <h2 class="cp-lib-title">Exercise Library</h2>

                <div class="cp-lib-search-wrap">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;">
                        <circle cx="11" cy="11" r="8" stroke="#878787" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35" stroke="#878787" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" class="cp-lib-search" id="cpLibSearch" placeholder="Search">
                </div>

                <div class="cp-lib-list" id="cpLibList">
                    <!-- Populated by createTrainingPlan.js -->
                </div>
            </div>

        </div><!-- /.cp-page -->
    </div><!-- /.canvas -->

    <script type="module" src="js/services/dataService.js"></script>
    <script type="module" src="js/services/authService.js"></script>
    <script type="module" src="js/shared/base.js"></script>
    <script type="module" src="js/pages/createTrainingPlan.js"></script>
</body>

</html>
